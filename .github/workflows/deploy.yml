name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-elattar
  cancel-in-progress: false

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to cPanel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://elattar.gawasem.com

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Pull, install, migrate, cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            bash deploy.sh

      - name: Upload compiled assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/*"
          target: ${{ secrets.DEPLOY_PATH }}/public
          strip_components: 0
          overwrite: true

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L https://elattar.gawasem.com || echo 000)
            if [ "$code" = "200" ]; then echo "OK ($code)"; exit 0; fi
            echo "Attempt $i → $code"; sleep 10
          done
          echo "Health check failed"; exit 1