name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-elattar
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to cPanel (FTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare root .htaccess for cPanel document root
        run: cp deploy/htaccess-root.txt .htaccess

      - name: Deploy to server via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /elattar/
          local-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/tests/**
            **/.phpunit.cache/**
            **/.phpunit.result.cache/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/framework/testing/**
            **/storage/pail/**
            **/.DS_Store
            **/Thumbs.db
            **/.idea/**
            **/.vscode/**
            **/.fleet/**
            **/Homestead.json
            **/Homestead.yaml
            **/auth.json
            **/npm-debug.log*
            **/yarn-error.log*
            **/pnpm-debug.log*

      - name: Post-deploy artisan commands (SSH)
        if: ${{ secrets.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ~/elattar
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
